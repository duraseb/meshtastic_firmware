[env:seeed-xiao-s3-alerts]
extends = esp32s3_base
board = seeed-xiao-s3  
board_level = pr
board_check = true
board_build.partitions = default_8MB.csv
upload_protocol = esptool
upload_speed = 921600
lib_deps =
  ${esp32s3_base.lib_deps}
build_unflags =
  ${esp32s3_base.build_unflags}
  -DARDUINO_USB_MODE=1
build_flags =
  ${esp32s3_base.build_flags}
  -D SEEED_XIAO_S3
  -I variants/esp32s3/seeed_xiao_s3_alerts
  -DBOARD_HAS_PSRAM
  -DHAS_ALERTING=1
  -DALERT_CHANNEL_NAME=\"${sysenv.ALERT_CHANNEL_NAME}\"
  -DARDUINO_USB_MODE=0
  -DGEMINI_API_KEY=\"${sysenv.GEMINI_API_KEY}\"
  -DPERPLEXITY_API_KEY=\"${sysenv.PERPLEXITY_API_KEY}\"
  -DMISTRAL_API_KEY=\"${sysenv.MISTRAL_API_KEY}\"
  -DGROQ_API_KEY=\"${sysenv.GROQ_API_KEY}\"
