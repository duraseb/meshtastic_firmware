[env:heltec-wsl-v3]
custom_meshtastic_hw_model = 44
custom_meshtastic_hw_model_slug = HELTEC_WSL_V3
custom_meshtastic_architecture = esp32-s3
custom_meshtastic_actively_supported = true
custom_meshtastic_support_level = 1
custom_meshtastic_display_name = Heltec Wireless Stick Lite V3
custom_meshtastic_images = heltec-wsl-v3.svg
custom_meshtastic_tags = Heltec
custom_meshtastic_partition_scheme = 8MB
 
extends = esp32s3_base
board = heltec_wifi_lora_32_V3
board_build.partitions = default_8MB.csv
# Temporary until espressif creates a release with this new target
build_flags = 
  ${esp32s3_base.build_flags}
  -D HELTEC_WSL_V3
  -I variants/esp32s3/heltec_wsl_v3
  -ULED_BUILTIN

# Bench variant for the SignalRouting test node (MBe4): same board, headless, with the modules it
# cannot use compiled out. The stock env above is left alone so it still matches upstream.
#
# Why: this board runs WiFi, an HTTPS web server, a 200-entry node database and the SR graph on one
# ESP32-S3 heap, and it was reduced to ~20 KB free — the web server was logging
# "Low heap, skipping HTTPS processing" and the node rebooted every few minutes.
#
# WIFI and SOCKETAPI are deliberately kept: the experiment harness drives this node over the TCP
# API, which is the whole reason it is on the network.
[env:heltec-wsl-v3-sr]
extends = env:heltec-wsl-v3
build_flags =
  ${env:heltec-wsl-v3.build_flags}
  -D MESHTASTIC_EXCLUDE_WEBSERVER=1        ; HTTPS/TLS buffers, the largest single consumer here
  -D MESHTASTIC_EXCLUDE_BLUETOOTH=1        ; driven over USB and WiFi; the BLE stack is not small
  -D MESHTASTIC_EXCLUDE_MQTT=1             ; Czar and FCM6 are the gateways, not this node
  -D MESHTASTIC_EXCLUDE_GPS=1              ; Wireless Stick Lite V3 has no GPS
  ; The sensor family is NOT excluded: the MAX17048 battery gauge inherits from the
  ; environmental-sensor base, so removing it fails to compile.
  -D MESHTASTIC_EXCLUDE_AUDIO=1
  -D MESHTASTIC_EXCLUDE_ACCELEROMETER=1
  -D MESHTASTIC_EXCLUDE_PAXCOUNTER=1
  -D MESHTASTIC_EXCLUDE_EXTERNALNOTIFICATION=1
  -D MESHTASTIC_EXCLUDE_CANNEDMESSAGES=1
  -D MESHTASTIC_EXCLUDE_INPUTBROKER=1
  -D MESHTASTIC_EXCLUDE_DROPZONE=1
  -D MESHTASTIC_EXCLUDE_WAYPOINT=1
  -D MESHTASTIC_EXCLUDE_ATAK=1
  -D MESHTASTIC_EXCLUDE_STOREFORWARD=1
  -D MESHTASTIC_EXCLUDE_POWERSTRESS=1
  -D MESHTASTIC_EXCLUDE_POWERMON=1
