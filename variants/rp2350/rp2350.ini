; Common settings for rp2350 Processor based targets
[rp2350_base]
platform =
  # TODO renovate
  https://github.com/maxgerhardt/platform-raspberrypi#cc24cfef37ed22ca9f2a6aead28c2deb76c39f24
  ; For arduino-pico >= 5.4.4
extends = arduino_base
platform_packages =
  # TODO renovate
  arduino-pico@https://github.com/earlephilhower/arduino-pico/releases/download/5.4.4/rp2040-5.4.4.zip

board_build.core = earlephilhower
board_build.filesystem_size = 0.5m
build_flags = 
  ${arduino_base.build_flags} -Wno-unused-variable -Wcast-align
  -Isrc/platform/rp2xx0
  -D__PLAT_RP2350__
  -D__FREERTOS=1
build_src_filter = 
  ${arduino_base.build_src_filter} -<platform/esp32/> -<nimble/> -<modules/esp32> -<platform/nrf52/> -<platform/stm32wl> -<mesh/eth/> -<mesh/wifi/> -<mesh/http/> -<mesh/raspihttp> -<platform/rp2xx0/pico_sleep> -<platform/rp2xx0/hardware_rosc>

lib_ignore =
  BluetoothOTA
  lvgl
  # arduino-pico gained the iLabs_Hearth submodule (Matter co-processor support) in 2026-08. The
  # platform installs the core from git: it clones HEAD with submodules and then checks out the
  # pinned older commit, which leaves libraries/iLabs_Hearth behind. The LDF then picks it up via
  # WiFi and it fails with '#error requires ESP_SERIAL_PORT'. It is never needed here.
  iLabs Hearth

lib_deps =
  ${arduino_base.lib_deps}
  ${environmental_base.lib_deps}
  ${environmental_extra.lib_deps}
  ${radiolib_base.lib_deps}
  # renovate: datasource=custom.pio depName=rweather/Crypto packageName=rweather/library/Crypto
  rweather/Crypto@0.4.0
